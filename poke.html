<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poke</title>
<style>
  html, body { height: 100%; margin: 0; display: grid; place-items: center;
               font: 16px system-ui, sans-serif; }
  form { display: flex; flex-direction: column; gap: .75em;
         width: min(22em, calc(100vw - 2.5em)); }
  input, button { font: inherit; padding: .8em 1em; border-radius: 10px;
                  border: 1px solid #8884; width: 100%; box-sizing: border-box; }
  button { cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .6; cursor: default; }
  dialog { border: none; border-radius: 14px; padding: 1.5em;
           box-shadow: 0 10px 40px #0003; }
  dialog::backdrop { background: #0006; backdrop-filter: blur(3px); }
  #error, .error { color: #c0392b; font-size: .9em; min-height: 1.2em; margin: 0; }
  .row { display: flex; gap: .5em; }
  .row > button { flex: 1; }
  /* Same padding on all sides plus an icon exactly one line tall makes this
     square with the same height as the text buttons beside it. */
  button { line-height: 1.25; }
  .row > .icon { flex: none; width: auto; padding: .8em; }
  .icon svg { display: block; width: 1.25em; height: 1.25em; }
  .link { border: none; background: none; width: auto; padding: 0;
          font-size: .85em; opacity: .6; text-decoration: underline; }
</style>

<dialog id="unlock">
  <form id="unlock-form">
    <input id="key" placeholder="key" autocomplete="off" autocapitalize="off"
           spellcheck="false" autofocus enterkeyhint="go">
    <button id="unlock-btn">unlock</button>
    <p id="error" role="alert"></p>
  </form>
</dialog>

<form id="poke-form" hidden>
  <input id="msg" placeholder="poke" autocomplete="off" maxlength="1000">
  <div class="row">
    <button id="send">poke</button>
    <button id="later" type="button" class="icon" aria-label="send later"
            title="send later">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </button>
  </div>
  <button id="forget" type="button" class="link">forget key</button>
</form>

<dialog id="schedule">
  <form id="schedule-form">
    <button id="schedule-cancel" type="button">cancel</button>
    <button id="schedule-default" type="button"></button>
    <button id="schedule-btn">send at:</button>
    <input id="when" type="datetime-local" required>
    <p id="schedule-error" class="error" role="alert"></p>
  </form>
</dialog>

<script>
  // The ntfy URL is not in this file in the clear: the page is public, and a
  // bare topic URL is a publish credential for anyone who views source.
  //
  // Below is AES-256-GCM ciphertext under a PBKDF2-SHA-256 key (250k iterations,
  // random per-blob salt and IV). Regenerate with:
  //
  //     node tools/encrypt-url.mjs 'https://ntfy.sh/my-topic' 'Passphrase'
  //
  // and paste the printed object over this constant. There is no separate
  // password check: GCM's auth tag fails on a wrong key, so a successful
  // decrypt *is* the verification.
  //
  // This is obfuscation behind a shared passphrase, not real access control.
  // The blob is public and therefore attackable offline, and anyone who learns
  // the passphrase has the URL permanently. If it leaks, rotate the ntfy topic
  // itself -- changing only the passphrase re-encrypts a URL others already hold.
  const ENCRYPTED_URL = {
    salt: 'aOOpwRhzwvl8qOUhSQSt/Q==',
    iv: 'JJGJm1oplNluIgZY',
    ct: '0XRQ9I1BR6n5j2XlqFIFODXuHS3gwg8JnyPvJWcIL/8a+4LM5X5jRo2APGE6b/R/2g==',
    iterations: 250000,
  };

  const unlock = document.getElementById('unlock');
  const unlockForm = document.getElementById('unlock-form');
  const unlockBtn = document.getElementById('unlock-btn');
  const keyInput = document.getElementById('key');
  const errorEl = document.getElementById('error');
  const pokeForm = document.getElementById('poke-form');
  const input = document.getElementById('msg');
  const btn = document.getElementById('send');
  const forgetBtn = document.getElementById('forget');
  const laterBtn = document.getElementById('later');
  const schedule = document.getElementById('schedule');
  const scheduleForm = document.getElementById('schedule-form');
  const scheduleBtn = document.getElementById('schedule-btn');
  const scheduleDefault = document.getElementById('schedule-default');
  const scheduleCancel = document.getElementById('schedule-cancel');
  const whenInput = document.getElementById('when');
  const scheduleError = document.getElementById('schedule-error');

  let ntfyURL = null;   // set once unlocked; kept in memory only

  const b64ToBytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function decryptURL(passphrase) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(ENCRYPTED_URL.salt),
        iterations: ENCRYPTED_URL.iterations, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    );
    // Throws on a wrong passphrase -- the auth tag is the check.
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(ENCRYPTED_URL.iv) }, key,
      b64ToBytes(ENCRYPTED_URL.ct));
    return new TextDecoder().decode(plain);
  }

  // Remembering the passphrase (not the decrypted URL) keeps one useful property:
  // the stored value is only worth anything against *this* blob, so rotating the
  // topic or passphrase silently invalidates it and re-prompts. Note this origin
  // is shared with other pages -- localStorage is per-origin, so any script you
  // serve from this domain can read the key back out. Namespaced to avoid
  // colliding with whatever else lives here.
  const STORAGE_KEY = 'poke:passphrase';

  // Storage throws outright in some privacy modes; a missing key is not fatal.
  const storage = {
    get() { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(STORAGE_KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(STORAGE_KEY); } catch {} },
  };

  function reveal() {
    unlock.close();
    pokeForm.hidden = false;
    input.focus();
  }

  forgetBtn.addEventListener('click', () => {
    storage.clear();
    location.reload();
  });

  unlockForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    unlockBtn.disabled = true;
    unlockBtn.textContent = 'unlocking...';
    try {
      ntfyURL = await decryptURL(keyInput.value);
      storage.set(keyInput.value);
      reveal();
    } catch {
      errorEl.textContent = 'wrong key';
      keyInput.select();
    } finally {
      unlockBtn.disabled = false;
      unlockBtn.textContent = 'unlock';
    }
  });

  // ntfy caps a message at 4096 bytes; count UTF-8, not UTF-16 units.
  const clampBytes = (s, max) => {
    const enc = new TextEncoder();
    if (enc.encode(s).length <= max) return s;
    let out = '';
    let n = 0;
    for (const ch of s) {              // iterate by code point, never split a surrogate pair
      const size = enc.encode(ch).length;
      if (n + size > max) break;
      out += ch;
      n += size;
    }
    return out;
  };

  // Collapse control chars (incl. CR/LF) to spaces so the body stays one clean
  // line, then fall back to "poke" when nothing meaningful is left.
  const messageBody = () => {
    const cleaned = input.value.replace(/[\u0000-\u001F\u007F]/g, ' ').trim();
    return clampBytes(cleaned || 'poke', 4096);
  };

  // Show a status on the poke button briefly, then reset it.
  const flash = (text) => {
    btn.disabled = true;
    btn.textContent = text;
    setTimeout(() => { btn.textContent = 'poke'; btn.disabled = false; }, 1200);
  };

  pokeForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!ntfyURL) return;
    btn.disabled = true;
    try {
      const res = await fetch(ntfyURL, { method: 'POST', body: messageBody() });
      flash(res.ok ? 'sent' : 'failed: ' + res.status);
    } catch (e) {
      flash('failed');
    }
  });

  // Scheduled delivery (https://docs.ntfy.sh/publish/#scheduled-delivery): ntfy
  // takes a unix timestamp, between 10 seconds and 3 days out. Passed as the `at`
  // query param rather than a header so the POST stays a CORS simple request.
  const MIN_DELAY_MS = 10 * 1000;
  const MAX_DELAY_MS = 3 * 24 * 60 * 60 * 1000;

  // datetime-local wants local wall-clock time as YYYY-MM-DDTHH:MM.
  const toLocalInput = (d) => {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` +
           `T${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  // Between 9:30pm and 9:30am, default to the next 9:30am; otherwise to 9:30pm.
  const defaultTime = (now) => {
    const at = (h) => {
      const d = new Date(now);
      d.setHours(h, 30, 0, 0);
      return d;
    };
    const morning = at(9);
    const evening = at(21);
    if (now < morning) return morning;
    if (now < evening) return evening;
    morning.setDate(morning.getDate() + 1);
    return morning;
  };

  const CUSTOM_OFFSET_MS = 10 * 60 * 1000;
  let defaultWhen = null;   // fixed when the dialog opens

  laterBtn.addEventListener('click', () => {
    const now = new Date();
    defaultWhen = defaultTime(now);
    scheduleDefault.textContent =
      'send at 9:30' + (defaultWhen.getHours() < 12 ? 'am' : 'pm');
    whenInput.value = toLocalInput(new Date(now.getTime() + CUSTOM_OFFSET_MS));
    whenInput.min = toLocalInput(now);
    whenInput.max = toLocalInput(new Date(now.getTime() + MAX_DELAY_MS));
    scheduleError.textContent = '';
    schedule.showModal();
  });

  scheduleCancel.addEventListener('click', () => schedule.close());
  // Esc would otherwise close the dialog mid-request, same as cancel.
  schedule.addEventListener('cancel', (e) => {
    if (scheduleCancel.disabled) e.preventDefault();
  });

  async function sendAt(when, button) {
    if (!ntfyURL) return;
    scheduleError.textContent = '';
    const delay = when.getTime() - Date.now();
    if (isNaN(delay)) { scheduleError.textContent = 'pick a time'; return; }
    if (delay < MIN_DELAY_MS) { scheduleError.textContent = 'that is in the past'; return; }
    if (delay > MAX_DELAY_MS) { scheduleError.textContent = 'at most 3 days out'; return; }

    const label = button.textContent;
    scheduleCancel.disabled = scheduleDefault.disabled = scheduleBtn.disabled = true;
    button.textContent = 'scheduling...';
    try {
      const url = new URL(ntfyURL);
      url.searchParams.set('at', String(Math.floor(when.getTime() / 1000)));
      const res = await fetch(url, { method: 'POST', body: messageBody() });
      if (res.ok) {
        schedule.close();
        flash('scheduled');
      } else {
        scheduleError.textContent = 'failed: ' + res.status;
      }
    } catch {
      scheduleError.textContent = 'failed';
    } finally {
      scheduleCancel.disabled = scheduleDefault.disabled = scheduleBtn.disabled = false;
      button.textContent = label;
    }
  }

  scheduleDefault.addEventListener('click', () => sendAt(defaultWhen, scheduleDefault));

  scheduleForm.addEventListener('submit', (e) => {
    e.preventDefault();
    // No zone suffix, so this parses as local time.
    sendAt(new Date(whenInput.value), scheduleBtn);
  });

  // Modal is not dismissable: no close button, and Esc is swallowed.
  unlock.addEventListener('cancel', (e) => e.preventDefault());

  (async () => {
    const saved = storage.get();
    if (saved) {
      try {
        ntfyURL = await decryptURL(saved);
        reveal();
        return;
      } catch {
        storage.clear();   // stale key: blob was rotated, or storage was tampered with
      }
    }
    unlock.showModal();
  })();
</script>
